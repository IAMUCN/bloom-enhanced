[package]
name = "bloom"
version = "3.10.1"
description = ""
authors = ["sehaz"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.61"
windows-collections = "0.2"
windows = { version = "0.61", features = [
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_Storage_Packaging_Appx",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_HiDpi",
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_UI_Accessibility",
	"Win32_System_Variant",
	"Media_Control",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Memory",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_SystemInformation",
	"Win32_System_Wmi",
	"Win32_Storage_FileSystem",
	"Win32_System_Ole",
	"Win32_System_DataExchange",
	"Data_Pdf",
	"Storage",
	"Storage_Streams",
	"Win32_System_Console",
	"Graphics_Imaging",
	"Win32_Graphics_Imaging",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_System_IO",
	"Win32_Security",
	"Win32_System_Registry",
	"Win32_Devices_FunctionDiscovery",
	"Devices_Radios",
	"Devices_Bluetooth",
	"Devices_Bluetooth_Advertisement",
	"Devices_Bluetooth_Rfcomm",
	"Networking",
	"Networking_Sockets",
	"Devices_Enumeration",
	"Foundation_Collections",
	"Win32_Media_KernelStreaming",
	"System_Power",
	"Devices_Power",
	"Win32_System_Power",
	"Win32_NetworkManagement_IpHelper",
	"Win32_NetworkManagement_Ndis",
	"Win32_NetworkManagement_WiFi",
	"Win32_NetworkManagement_WNet"
] }
base64 = "0.22"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.7.1"
wmi = "0.14"
tokio = { version = "1", features = ["time", "sync"] }
webview2-com = "0.38"
image = "0.25"
# Reads the thumbnail or text inside Office files for shelf previews.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-drag = "2.1.1"
tauri-plugin-dialog = "2"
rustfft = "6"
lopdf = { version = "0.46.0", default-features = false }


# Release builds are optimised for a small installer: whole-program
# optimisation, one codegen unit, no debug symbols. (panic stays "unwind":
# utils.rs relies on catch_unwind.)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The number-crunching crates (file conversions, the audio visualizer) keep
# full speed optimisation.
[profile.release.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
image-webp = { opt-level = 3 }
tiff = { opt-level = 3 }
gif = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
flate2 = { opt-level = 3 }
zip = { opt-level = 3 }
lopdf = { opt-level = 3 }
rustfft = { opt-level = 3 }
